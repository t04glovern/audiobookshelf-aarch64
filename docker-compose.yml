services:
  audiobookshelf:
    build:
      context: ./build
      dockerfile: Dockerfile
      args:
        - TARGETPLATFORM=linux/arm64
    image: audiobookshelf:local-arm64
    container_name: audiobookshelf
    ports:
      - "13378:80"
    volumes:
      # Media libraries - adjust these paths to your actual audiobook/podcast locations
      - ./audiobooks:/audiobooks
      - ./podcasts:/podcasts
      # Persistent data
      - ./config:/config
      - ./metadata:/metadata
    environment:
      - TZ=Australia/Perth  # Adjust to your timezone
    restart: unless-stopped
    # Uncomment to run as specific user (replace with your UID:GID from `id` command)
    # user: "1000:1000"
